    <script>
        // Header background change on scroll
        const header = document.getElementById('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('bg-slate-950/80');
                header.classList.remove('glass');
            } else {
                header.classList.remove('bg-slate-950/80');
                header.classList.add('glass');
            }
        });

        // Intersection Observer for Fade-up animations
        const revealElements = document.querySelectorAll('.reveal');
        
        const revealOptions = {
            threshold: 0.1,
            rootMargin: "0px 0px -50px 0px"
        };

        const revealObserver = new IntersectionObserver(function(entries, observer) {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                entry.target.classList.add('active');
                observer.unobserve(entry.target); // Animate only once
            });
        }, revealOptions);

        revealElements.forEach(el => {
            revealObserver.observe(el);
        });

        // Number Counter Animation
        const counters = document.querySelectorAll('.counter');
        const speed = 200; // The lower the slower

        const counterObserver = new IntersectionObserver(function(entries, observer) {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                
                const counter = entry.target;
                const updateCount = () => {
                    const target = +counter.getAttribute('data-target');
                    const count = +counter.innerText;
                    
                    // Lower inc to slow and higher to speed up
                    const inc = target / speed;

                    if (count < target) {
                        counter.innerText = Math.ceil(count + inc);
                        setTimeout(updateCount, 10);
                    } else {
                        counter.innerText = target;
                    }
                };
                updateCount();
                observer.unobserve(counter); // Count only once
            });
        }, { threshold: 0.5 });

        counters.forEach(counter => {
            counterObserver.observe(counter);
        });
    </script>

    <!-- Firebase Auth 연동 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged, 
            signInWithCustomToken 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        let app, auth;
        
        try {
            // 시스템에서 제공하는 Firebase 환경 설정 로드
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (firebaseConfig) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
            } else {
                console.warn("Firebase 설정이 없습니다. 인증 기능이 작동하지 않을 수 있습니다.");
            }
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        if (auth) {
            // 초기 토큰(관리자 제공 등)이 있다면 자동 로그인 처리
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                signInWithCustomToken(auth, __initial_auth_token).catch(console.error);
            }

            const authModal = document.getElementById('authModal');
            const authModalContent = document.getElementById('authModalContent');
            const headerAuthBtn = document.getElementById('headerAuthBtn');
            const closeAuthModal = document.getElementById('closeAuthModal');
            
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            
            const loginError = document.getElementById('loginError');
            const signupError = document.getElementById('signupError');
            const authSuccessMsg = document.getElementById('authSuccessMsg');

            // 팝업 열기/닫기 애니메이션
            const openModal = () => {
                authModal.classList.remove('hidden');
                setTimeout(() => {
                    authModal.classList.remove('opacity-0');
                    authModalContent.classList.remove('scale-95');
                }, 10);
            };

            const closeModal = () => {
                authModal.classList.add('opacity-0');
                authModalContent.classList.add('scale-95');
                setTimeout(() => {
                    authModal.classList.add('hidden');
                    resetForms();
                }, 300); // Tailwind duration-300과 일치
            };

            // 헤더 버튼 클릭: 로그인 상태면 로그아웃, 아니면 팝업 열기
            headerAuthBtn.addEventListener('click', () => {
                if (auth.currentUser) {
                    signOut(auth).then(() => {
                        headerAuthBtn.innerText = '로그인';
                    });
                } else {
                    openModal();
                }
            });
            
            closeAuthModal.addEventListener('click', closeModal);
            // 배경 클릭 시 모달 닫기
            authModal.addEventListener('click', (e) => {
                if(e.target === authModal) closeModal();
            });

            const switchTab = (isLogin) => {
                resetForms();
                if (isLogin) {
                    tabLogin.classList.add('border-b-2', 'border-blue-500', 'text-white', 'font-bold');
                    tabLogin.classList.remove('text-slate-400', 'font-medium');
                    tabSignup.classList.remove('border-b-2', 'border-blue-500', 'text-white', 'font-bold');
                    tabSignup.classList.add('text-slate-400', 'font-medium');
                    loginForm.classList.remove('hidden');
                    signupForm.classList.add('hidden');
                } else {
                    tabSignup.classList.add('border-b-2', 'border-blue-500', 'text-white', 'font-bold');
                    tabSignup.classList.remove('text-slate-400', 'font-medium');
                    tabLogin.classList.remove('border-b-2', 'border-blue-500', 'text-white', 'font-bold');
                    tabLogin.classList.add('text-slate-400', 'font-medium');
                    signupForm.classList.remove('hidden');
                    loginForm.classList.add('hidden');
                }
            };

            tabLogin.addEventListener('click', () => switchTab(true));
            tabSignup.addEventListener('click', () => switchTab(false));

            const resetForms = () => {
                loginForm.reset();
                signupForm.reset();
                loginError.classList.add('hidden');
                signupError.classList.add('hidden');
                authSuccessMsg.classList.add('hidden');
            };

            // 1. 로그인 전송
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.classList.add('hidden');
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    loginForm.classList.add('hidden');
                    authSuccessMsg.innerText = "로그인 성공! 환영합니다.";
                    authSuccessMsg.classList.remove('hidden');
                    setTimeout(closeModal, 1500);
                } catch (error) {
                    let msg = error.message;
                    if (error.code === 'auth/invalid-credential') msg = '이메일이나 비밀번호가 일치하지 않습니다.';
                    loginError.innerText = msg;
                    loginError.classList.remove('hidden');
                }
            });

            // 2. 회원가입 전송
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                signupError.classList.add('hidden');
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;
                
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                    signupForm.classList.add('hidden');
                    authSuccessMsg.innerText = "회원가입 완료! 자동 로그인 되었습니다.";
                    authSuccessMsg.classList.remove('hidden');
                    setTimeout(closeModal, 1500);
                } catch (error) {
                    let msg = error.message;
                    if (error.code === 'auth/email-already-in-use') msg = "이미 가입된 이메일입니다.";
                    if (error.code === 'auth/weak-password') msg = "비밀번호는 6자리 이상이어야 합니다.";
                    signupError.innerText = msg;
                    signupError.classList.remove('hidden');
                }
            });

            // 인증 상태 리스너 (헤더 UI 변경)
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const displayName = user.email ? user.email.split('@')[0] : '사용자';
                    headerAuthBtn.innerText = `로그아웃 (${displayName})`;
                } else {
                    headerAuthBtn.innerText = '로그인';
                }
            });
        }
    </script>
