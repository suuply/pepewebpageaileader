    <!-- Auth Modal UI -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="glass glass-card rounded-3xl p-8 w-full max-w-sm mx-4 relative transform scale-95 transition-transform duration-300" id="authModalContent">
            <button id="closeAuthModal" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
